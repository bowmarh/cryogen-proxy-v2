# Checks every 30 minutes that the dashboard is up and its database answers.
# A failed run triggers GitHub email notifications to repository watchers.
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Dashboard & Check Health
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # Step 1: Ping the API endpoint (up to 3 attempts)
      - name: Is the dashboard up?
        id: health_check
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Checking https://club.cryo-gen.team/api/ping..."
            if curl -fsS --max-time 20 https://club.cryo-gen.team/api/ping | grep -q '"ok":true'; then
              echo "✅ Dashboard is up and database is responding."
              exit 0
            fi
            echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
            sleep 15
          done
          echo "❌ Outage detected: The dashboard did not answer or the database is down."
          exit 1

      # Step 2: Run Gemini CLI for automated downtime diagnostics (runs only if Step 1 fails)
      - name: Run Gemini Downtime Diagnosis
        if: failure()
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_model: "gemini-2.5-flash"
          prompt: "The endpoint https://club.cryo-gen.team/api/ping failed 3 consecutive health checks. Provide a brief checklist of common causes (DNS, Vercel deployment, Supabase database connection pool) to assist with recovery."
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Independent of the app and its database: has the "TTT schedule" workflow succeeded lately? When storage is down the dashboard cannot record
  # its own scheduled runs, so GitHub's own record is the one to trust. A gap over 90 minutes fails this run (GitHub emails you).
  ticks:
    name: Have the scheduled runs happened?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Last successful scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/ttt-schedule.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then
            echo "::error::The TTT schedule workflow has no successful run on record."
            exit 1
          fi
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "Last successful scheduled run: $last ($age minutes ago)"
          if [ "$age" -gt 90 ]; then
            echo "::error::No successful scheduled run for $age minutes. Check the TTT schedule workflow and the CRON_SECRET secret."
            exit 1
          fi
