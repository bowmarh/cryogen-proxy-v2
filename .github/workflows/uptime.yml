# Checks every 30 minutes that the dashboard is up and its database answers. A failed run is emailed to the people who watch this repository
# (GitHub's own notification), so an outage is noticed without anyone opening the app.
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Is the dashboard up?
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 20 https://club.cryo-gen.team/api/ping | grep -q '"ok":true'; then echo "up"; exit 0; fi
            echo "attempt $i failed"; sleep 15
          done
          echo "The dashboard did not answer, or its database is down."; exit 1
