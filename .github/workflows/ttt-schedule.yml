# Calls the dashboard every 15 minutes so TTT reminders, auto-close and the
# next-week rollover happen on time. Needs the CRON_SECRET repository secret
# (same value as the CRON_SECRET environment variable in Vercel).
#
# The run FAILS (so GitHub emails you) when the secret is missing, the app does not answer with 200, or three or more of its scheduled jobs failed.
# Earlier versions had two Gemini CLI steps in front of the call; they could not work (no `gemini` command was installed) and stopped the call from
# ever running, so they were removed. They are in the git history if you want them back, after the call, with continue-on-error.
name: TTT schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due scheduled jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::The CRON_SECRET repository secret is not set, so no scheduled job can run."
            exit 1
          fi
          code=$(curl -sS --max-time 45 -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://club.cryo-gen.team/api/cron/tick?speed=auto") || code=000
          echo "HTTP $code"
          cat resp.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::The dashboard answered HTTP $code."
            exit 1
          fi
          failed=$(jq -r '(.failed // []) | length' resp.json 2>/dev/null || echo 0)
          if [ "${failed:-0}" -ge 3 ]; then
            echo "::error::$failed scheduled jobs failed (is the database reachable?)."
            exit 1
          fi
