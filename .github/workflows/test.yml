# Runs the automated tests on every pull request and every push to main.
# The tests use no network and no packages (Node's built-in test runner).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test --test-timeout=30000 test/*.test.js
