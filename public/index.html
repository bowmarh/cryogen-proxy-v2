<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRYO-GEN Cycling Club</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c18;color:white;font-family:system-ui,sans-serif;min-height:100vh}
    select option{background:#0f1623}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0f1623}
    ::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
    input,select{color-scheme:dark}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6b7280;font-family:system-ui">Loading CRYO-GEN…</div></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;

// ── Inline SVG Icons (no CDN needed)
const Icon = ({ d, size=14, color="currentColor", ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...(p.style||{})}} {...p}>
    {Array.isArray(d) ? d.map((path,i)=><path key={i} d={path}/>) : <path d={d}/>}
  </svg>
);
const I = {
  users:      ["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2","M23 21v-2a4 4 0 0 0-3-3.87","M16 3.13a4 4 0 0 1 0 7.75","M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"],
  trophy:     ["M8 21h8","M12 17v4","M6 3H3v5c0 5 3 8 9 8s9-3 9-8V3h-3","M6 3c0 4 2 7 6 7s6-3 6-7"],
  bike:       ["M5 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0","M15 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0","M5 19l3.5-7L12 9l4 3 3-5","M12 9V5l-3 2"],
  chart:      ["M18 20V10","M12 20V4","M6 20v-6"],
  settings:   ["M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6","M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1"],
  plus:       ["M12 5v14","M5 12h14"],
  search:     ["M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14","M21 21l-4.35-4.35"],
  x:          ["M18 6L6 18","M6 6l12 12"],
  check:      ["M22 11.08V12a10 10 0 1 1-5.93-9.14","M22 4L12 14.01l-3-3"],
  clock:      ["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20","M12 6v6l4 2"],
  zap:        "M13 2L3 14h9l-1 8 10-12h-9l1-8",
  activity:   "M22 12h-4l-3 9L9 3l-3 9H2",
  trending:   ["M23 6l-9.5 9.5-5-5L1 18","M17 6h6v6"],
  pin:        ["M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0","M12 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2"],
  download:   ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4","M7 10l5 5 5-5","M12 15V3"],
  lock:       ["M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2","M7 11V7a5 5 0 0 1 10 0v4"],
  unlock:     ["M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2","M7 11V7a5 5 0 0 1 9.9-1"],
  chevron:    "M9 18l6-6-6-6",
  shield:     "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10",
  calendar:   ["M3 4h18v18H3z","M3 9h18","M8 2v4","M16 2v4"],
  refresh:    ["M23 4v6h-6","M1 20v-6h6","M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"],
  shield2:    ["M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"],
};

// ── Constants
const CAT_COLOR = { "A+":"#FFD700", A:"#EF4444", B:"#3B82F6", C:"#10B981", D:"#8B5CF6" };
const PH_EMOJI  = { climber:"🏔️", sprinter:"⚡", puncheur:"🥊", "all-rounder":"⭐", "time-trialist":"⏱️", pursuiter:"🎯" };
const ZRA_COLOR = { Diamond:"#00D4FF", Ruby:"#EF4444", Emerald:"#10B981", Sapphire:"#3B82F6", Amethyst:"#8B5CF6", Platinum:"#E2E8F0", Gold:"#FBBF24", Silver:"#9CA3AF", Bronze:"#B45309", Copper:"#92400E" };
const TT_STYLE  = { background:"#0b1020", border:"1px solid rgba(255,255,255,0.12)", borderRadius:10, fontSize:12 };
const toFlag    = cc => (cc||"").toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
const fmtDate   = ts => new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const cleanCC   = cc => (cc||"gb").split("-")[0];
const mapPh     = v => (v||"all-rounder").toLowerCase().replace(/\s+/g,"-");
const mapRiders = data => (data.riders||[]).map(r => ({
  id:r.riderId, name:r.name, cc:cleanCC(r.country), cat:r.zpCategory||"D",
  ftp:Math.round(r.zpFTP||0),
  wkg:r.power ? Math.round((r.power.wkg1200||0)*100)/100 : 0,
  velo:r.race?.current?.rating ? Math.round(r.race.current.rating) : 0,
  zraCat:r.race?.current?.mixed?.category||"",
  ph:mapPh(r.phenotype?.value),
  wins:r.race?.wins||0, podiums:r.race?.podiums||0, finishes:r.race?.finishes||0,
  active:!!(r.race?.current?.rating>0), gender:r.gender||"M",
}));

const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

// ── Mock data (shown if API unavailable)
const MEMBERS = [
  {id:1, name:"Michael Mansfield (CRYO)", cc:"us", cat:"A+", ftp:392, wkg:5.35, velo:3044, zraCat:"Diamond",  ph:"all-rounder",  active:true},
  {id:2, name:"Norman Henderson",         cc:"gb", cat:"A",  ftp:370, wkg:4.73, velo:2409, zraCat:"Diamond",  ph:"all-rounder",  active:true},
  {id:3, name:"Owen Graham",              cc:"gb", cat:"B",  ftp:287, wkg:4.12, velo:1901, zraCat:"Ruby",     ph:"time-trialist",active:true},
  {id:4, name:"Rick (CRYO-GEN)",          cc:"ie", cat:"B",  ftp:282, wkg:4.07, velo:1325, zraCat:"Amethyst", ph:"all-rounder",  active:true},
  {id:5, name:"Roxanne Timmins",          cc:"gb", cat:"D",  ftp:179, wkg:2.15, velo:505,  zraCat:"Copper",   ph:"sprinter",     active:true},
];
const VELO_TREND = [{w:"W14",v:1268},{w:"W15",v:1282},{w:"W16",v:1275},{w:"W17",v:1301},{w:"W18",v:1318},{w:"W19",v:1312},{w:"W20",v:1334},{w:"W21",v:1347}];
const RESULTS = [
  {event:"WTRL TTT S9 W12",date:"14 May",pos:3,total:18,cat:"B",time:"28:14",wkg:3.68},
  {event:"ZRL Division 4",  date:"12 May",pos:1,total:24,cat:"C",time:"42:08",wkg:3.11},
  {event:"Herd Spring R5",  date:"10 May",pos:7,total:45,cat:"A",time:"18:52",wkg:4.31},
  {event:"CRYO Internal",   date:"7 May", pos:1,total:32,cat:"B",time:"35:20",wkg:3.84},
  {event:"ZRL Division 4",  date:"5 May", pos:2,total:22,cat:"C",time:"41:55",wkg:3.15},
];
const TTT_EVENT = {
  title:"CRYO-GEN Weekly TTT", date:"Wed 28 May 2026", time:"19:00 UTC",
  route:"Tempus Fugit", dist:"17.3 km", maxRiders:40, format:"4-rider teams · best 3 times count",
  desc:"Sign up by Tue 18:00 UTC. Min 4 riders per team.",
};
const INIT_RIDES = [
  {id:1,title:"Easy Endurance Spin",     date:"2026-05-26",time:"07:00 UTC",route:"Watopia Hilly",       dist:"45 km",pace:"2.0–2.5 w/kg",max:25,desc:"Relaxed social spin. No one gets dropped.",cat:"All"},
  {id:2,title:"B/C Group Ride",          date:"2026-05-27",time:"18:30 UTC",route:"Richmond UCI Circuit", dist:"32 km",pace:"2.5–3.2 w/kg",max:20,desc:"Steady group ride for B and C riders.",    cat:"B/C"},
  {id:3,title:"Thursday Night Chaingang",date:"2026-05-29",time:"19:00 UTC",route:"Crit City – Bell Lap", dist:"25 km",pace:"3.5+ w/kg",   max:15,desc:"Fast chaingang. A/B only. No flicking.",   cat:"A/B"},
  {id:4,title:"Weekend Long Ride",       date:"2026-05-31",time:"09:00 UTC",route:"Epic KOM Reverse",    dist:"85 km",pace:"2.0–3.0 w/kg",max:30,desc:"Big base miles. Coffee stop at the top!",  cat:"All"},
];

function CatBadge({cat}) {
  const c = CAT_COLOR[cat]||"#888";
  return <span style={{background:c+"22",color:c,border:`1px solid ${c}44`,padding:"1px 7px",borderRadius:4,fontSize:11,fontWeight:700}}>{cat}</span>;
}
function StatCard({d,label,value,sub,color="#00D4FF"}) {
  return (
    <div style={{background:"#0f1623",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <Icon d={d} size={13} color={color}/>
        <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color,opacity:0.8}}>{label}</span>
      </div>
      <div style={{fontSize:22,fontWeight:900}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:"#6b7280",marginTop:3}}>{sub}</div>}
    </div>
  );
}

function App() {
  const [tab,setTab]           = useState("dashboard");
  const [sideOpen,setSide]     = useState(true);
  const [showAdmin,setAdmin]   = useState(false);
  const [showRide,setShowRide] = useState(false);
  const [signups,setSignupsRaw]= useState([]);
  const [tttLocked,setLocked]  = useState(false);
  const [supName,setSupName]   = useState("");
  const [supCat,setSupCat]     = useState("B");
  const [rides,setRidesRaw]    = useState(INIT_RIDES);
  const [rsvps,setRsvpsRaw]    = useState({});
  const [rsvpId,setRsvpId]     = useState(null);
  const [rsvpName,setRsvpName] = useState("");
  const [newRide,setNewRide]   = useState({title:"",date:"",time:"",route:"",dist:"",pace:"",max:"20",desc:"",cat:"All"});
  const [mSearch,setMSearch]   = useState("");
  const [mCat,setMCat]         = useState("All");
  const [mActive,setMActive]   = useState(false);
  const [mPage,setMPage]       = useState(1);
  const [liveRiders,setLive]   = useState([]);
  const [liveStatus,setLS]     = useState("loading");
  const [liveMsg,setLM]        = useState("Connecting…");
  const PER = 10;

  useEffect(() => {
    const s=load("cg_s"); if(s) setSignupsRaw(s);
    const r=load("cg_r"); if(r) setRsvpsRaw(r);
    const ri=load("cg_ri"); if(ri) setRidesRaw(ri);
    fetchLive();
  }, []);

  const setSignups = v => { setSignupsRaw(v); save("cg_s",v); };
  const setRsvps   = v => { setRsvpsRaw(v);  save("cg_r",v); };
  const setRides   = v => { setRidesRaw(v);  save("cg_ri",v); };

  const fetchLive = async () => {
    setLS("loading"); setLM("Connecting to ZwiftRacing.app…");
    try {
      const r = await fetch("/api/proxy?endpoint=team");
      if (r.ok) {
        const d = await r.json();
        if (d.riders && Array.isArray(d.riders)) {
          const mapped = mapRiders(d);
          setLive(mapped); setLS("ok");
          setLM(`Live · ${mapped.length} CRYO-GEN riders loaded ✓`);
        } else { setLS("error"); setLM("Unexpected response from proxy"); }
      } else { setLS("error"); setLM(`Proxy error ${r.status}`); }
    } catch(e) { setLS("error"); setLM(`${e.message}`); }
  };

  const members = liveRiders.length > 0 ? liveRiders : MEMBERS;
  const active  = members.filter(m => m.active);
  const avgVelo = active.length ? Math.round(active.reduce((s,m)=>s+m.velo,0)/active.length) : 0;
  const catDist = useMemo(()=>{
    const c={};
    active.forEach(m=>{ c[m.cat]=(c[m.cat]||0)+1; });
    return ["A+","A","B","C","D"].filter(k=>c[k]).map(cat=>({cat,count:c[cat]}));
  },[active]);
  const filteredM = useMemo(()=>members.filter(m=>
    m.name.toLowerCase().includes(mSearch.toLowerCase())&&(mCat==="All"||m.cat===mCat)&&(!mActive||m.active)
  ),[members,mSearch,mCat,mActive]);
  const pagedM  = filteredM.slice((mPage-1)*PER, mPage*PER);
  const totalPg = Math.ceil(filteredM.length/PER)||1;

  const doSignup = () => {
    if (!supName.trim()) return;
    if (tttLocked) { alert("Sign-ups are locked."); return; }
    if (signups.find(s=>s.name.toLowerCase()===supName.toLowerCase())) { alert("Already signed up!"); return; }
    if (signups.length>=TTT_EVENT.maxRiders) { alert("Event is full."); return; }
    setSignups([...signups,{name:supName.trim(),cat:supCat,ts:new Date().toISOString()}]);
    setSupName("");
  };
  const rmSignup    = ts => setSignups(signups.filter(s=>s.ts!==ts));
  const confirmRsvp = id => {
    if (!rsvpName.trim()) return;
    const cur=rsvps[id]||[];
    if (cur.find(r=>r.name.toLowerCase()===rsvpName.toLowerCase())) { alert("Already RSVP'd!"); return; }
    setRsvps({...rsvps,[id]:[...cur,{name:rsvpName.trim(),ts:new Date().toISOString()}]});
    setRsvpId(null); setRsvpName("");
  };
  const cancelRsvp = (id,name) => setRsvps({...rsvps,[id]:(rsvps[id]||[]).filter(r=>r.name!==name)});
  const createRide = () => {
    if (!newRide.title||!newRide.date) { alert("Title and date required."); return; }
    setRides([...rides,{...newRide,id:Date.now(),max:parseInt(newRide.max)||20}]);
    setShowRide(false);
    setNewRide({title:"",date:"",time:"",route:"",dist:"",pace:"",max:"20",desc:"",cat:"All"});
  };
  const exportCsv = () => {
    const rows=[["Name","Cat","Signed Up"],...signups.map(s=>[s.name,s.cat,new Date(s.ts).toLocaleString()])];
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
    a.download="cryogen_ttt.csv"; a.click();
  };

  const scol={idle:"#6b7280",loading:"#FBBF24",ok:"#10B981",error:"#EF4444"}[liveStatus];
  const NAV=[
    {id:"dashboard",label:"Dashboard",   d:I.chart},
    {id:"racing",   label:"Racing",      d:I.trophy},
    {id:"ttt",      label:"TTT Sign-Up", d:I.clock},
    {id:"rides",    label:"Social Rides",d:I.bike},
    {id:"members",  label:"Members",     d:I.users},
  ];
  const S={
    card:{background:"#0f1623",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12},
    inp:{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"9px 12px",color:"white",fontSize:13,outline:"none"},
    td:{padding:"11px 18px",borderBottom:"1px solid rgba(255,255,255,0.04)",color:"white"},
    th:{padding:"9px 18px",textAlign:"left",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"#6b7280",borderBottom:"1px solid rgba(255,255,255,0.07)"},
    lbl:{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"#6b7280",display:"block",marginBottom:5},
    btn:(active)=>({display:"flex",alignItems:"center",gap:6,padding:"7px 14px",background:active?"rgba(0,212,255,0.1)":"rgba(255,255,255,0.05)",border:active?"1px solid rgba(0,212,255,0.2)":"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:active?"#00D4FF":"#9ca3af",fontSize:12,cursor:"pointer"}),
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",background:"#080c18"}}>
      {/* SIDEBAR */}
      <aside style={{display:"flex",flexDirection:"column",flexShrink:0,width:sideOpen?220:52,background:"#070b17",borderRight:"1px solid rgba(255,255,255,0.07)",transition:"width 0.2s",overflow:"hidden"}}>
        <div style={{padding:14,borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",alignItems:"center",gap:10,minWidth:52}}>
          <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,#00D4FF,#0066CC)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#000",flexShrink:0}}>CG</div>
          {sideOpen&&<div style={{whiteSpace:"nowrap"}}><div style={{fontSize:13,fontWeight:900,color:"white"}}>CRYO-GEN</div><div style={{fontSize:10,color:"#4b5563"}}>Cycling Club</div></div>}
        </div>
        <nav style={{flex:1,padding:8}}>
          {NAV.map(({id,label,d})=>(
            <button key={id} onClick={()=>setTab(id)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:8,border:tab===id?"1px solid rgba(0,212,255,0.2)":"1px solid transparent",background:tab===id?"rgba(0,212,255,0.08)":"transparent",color:tab===id?"#00D4FF":"#6b7280",cursor:"pointer",marginBottom:2,textAlign:"left",whiteSpace:"nowrap"}}>
              <Icon d={d} size={15} color={tab===id?"#00D4FF":"#6b7280"}/>
              {sideOpen&&<span style={{fontSize:12,fontWeight:600}}>{label}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:8,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
          <button onClick={()=>setAdmin(true)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:8,border:"1px solid transparent",background:"transparent",color:"#4b5563",cursor:"pointer",whiteSpace:"nowrap"}}>
            <Icon d={I.settings} size={15} color="#4b5563"/>
            {sideOpen&&<span style={{fontSize:12,fontWeight:600}}>Admin</span>}
          </button>
          <button onClick={()=>setSide(o=>!o)} style={{width:"100%",display:"flex",justifyContent:"center",padding:8,border:"none",background:"transparent",color:"#374151",cursor:"pointer",marginTop:4}}>
            <Icon d={I.chevron} size={13} color="#374151" style={{transform:sideOpen?"rotate(180deg)":"none",transition:"transform 0.2s"}}/>
          </button>
        </div>
      </aside>

      {/* MAIN */}
      <main style={{flex:1,overflow:"auto",padding:32}}>
        <div style={{maxWidth:960,margin:"0 auto"}}>

        {/* ── DASHBOARD ── */}
        {tab==="dashboard"&&(
          <div style={{display:"flex",flexDirection:"column",gap:24}}>
            <div>
              <h2 style={{fontSize:20,fontWeight:900,margin:0,color:"white"}}>Team Overview</h2>
              <p style={{fontSize:13,color:"#6b7280",marginTop:4}}>ZwiftPower · ZwiftRacing.app{liveRiders.length>0?" · live ✓":""}</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              <StatCard d={I.users}    label="Active Riders"  value={active.length}               sub={liveRiders.length>0?`${liveRiders.length} in API`:"mock data"} color="#00D4FF"/>
              <StatCard d={I.clock}   label="TTT Signups"    value={`${signups.length}/${TTT_EVENT.maxRiders}`} sub="Wed 28 May · 19:00 UTC"                        color="#10B981"/>
              <StatCard d={I.bike}    label="Upcoming Rides" value={rides.length}                 sub="Next ride coming up"                                          color="#8B5CF6"/>
              <StatCard d={I.trending}label="Avg Team vELO"  value={avgVelo||"—"}                 sub={liveRiders.length>0?"Live":"mock data"}                       color="#F59E0B"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16}}>
              <div style={{...S.card,padding:20}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280",marginBottom:16}}>Team Avg vELO — Last 8 Weeks</div>
                <ResponsiveContainer width="100%" height={150}>
                  <LineChart data={VELO_TREND} margin={{top:5,right:10,left:0,bottom:5}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)"/>
                    <XAxis dataKey="w" axisLine={false} tickLine={false} tick={{fontSize:10,fill:"#6b7280"}}/>
                    <YAxis domain={[1200,1400]} axisLine={false} tickLine={false} tick={{fontSize:10,fill:"#6b7280"}}/>
                    <Tooltip contentStyle={TT_STYLE} labelStyle={{color:"#fff"}} itemStyle={{color:"#00D4FF"}}/>
                    <Line type="monotone" dataKey="v" name="vELO" stroke="#00D4FF" strokeWidth={2.5} dot={{fill:"#00D4FF",r:3,strokeWidth:0}}/>
                  </LineChart>
                </ResponsiveContainer>
              </div>

                <div style={{fontSize:12,color:"#9ca3af"}}>{liveMsg}</div>
              </div>
              <button onClick={fetchLive} style={{padding:"10px 0",background:"rgba(0,212,255,0.1)",color:"#00D4FF",border:"1px solid rgba(0,212,255,0.2)",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>↻ Refresh Live Data Now</button>
              <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:14}}>
                <div style={{fontSize:10,fontWeight:700,color:"#ef4444",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Danger Zone</div>
                <button onClick={()=>{if(window.confirm("Clear all TTT sign-ups?"))setSignups([]);}} style={{width:"100%",padding:"9px 0",background:"rgba(239,68,68,0.1)",color:"#f87171",border:"1px solid rgba(239,68,68,0.25)",borderRadius:8,cursor:"pointer",fontSize:13}}>Clear All TTT Sign-ups</button>
              </div>
            </div>
            <div style={{padding:"14px 20px",borderTop:"1px solid rgba(255,255,255,0.07)"}}>
              <button onClick={()=>setAdmin(false)} style={{width:"100%",padding:"11px 0",background:"#06b6d4",color:"#000",fontWeight:700,borderRadius:8,border:"none",cursor:"pointer",fontSize:14}}>Close</button>
            </div>
          </div>
        </div>
      )}

      {/* NEW RIDE MODAL */}
      {showRide&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:16}}>
          <div style={{background:"#0d1322",border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,width:"100%",maxWidth:480}}>
            <div style={{padding:"16px 20px",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:15,color:"white"}}>Create New Ride</span>
              <button onClick={()=>setShowRide(false)} style={{background:"none",border:"none",cursor:"pointer",display:"flex"}}><Icon d={I.x} size={16} color="#6b7280"/></button>
            </div>
            <div style={{padding:20,display:"flex",flexDirection:"column",gap:12,maxHeight:"60vh",overflowY:"auto"}}>
              {[{k:"title",lbl:"Title",ph:"e.g. Thursday Night Chaingang"},{k:"route",lbl:"Route",ph:"e.g. Watopia Hilly"},{k:"dist",lbl:"Distance",ph:"e.g. 45 km"},{k:"pace",lbl:"Pace",ph:"e.g. 2.5–3.2 w/kg"},{k:"desc",lbl:"Description",ph:"Brief description"}].map(({k,lbl,ph})=>(
                <div key={k}><label style={S.lbl}>{lbl}</label><input value={newRide[k]} onChange={e=>setNewRide(r=>({...r,[k]:e.target.value}))} placeholder={ph} style={S.inp}/></div>
              ))}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                <div><label style={S.lbl}>Date</label><input type="date" value={newRide.date} onChange={e=>setNewRide(r=>({...r,date:e.target.value}))} style={S.inp}/></div>
                <div><label style={S.lbl}>Time (UTC)</label><input value={newRide.time} onChange={e=>setNewRide(r=>({...r,time:e.target.value}))} placeholder="19:00 UTC" style={S.inp}/></div>
                <div><label style={S.lbl}>Max Riders</label><input type="number" value={newRide.max} onChange={e=>setNewRide(r=>({...r,max:e.target.value}))} style={S.inp}/></div>
              </div>
              <div><label style={S.lbl}>Category</label>
                <select value={newRide.cat} onChange={e=>setNewRide(r=>({...r,cat:e.target.value}))} style={S.inp}>{["All","A/B","B/C","C/D"].map(c=><option key={c}>{c}</option>)}</select>
              </div>
            </div>
            <div style={{padding:"14px 20px",borderTop:"1px solid rgba(255,255,255,0.07)",display:"flex",gap:8}}>
              <button onClick={createRide} style={{flex:1,padding:"10px 0",background:"#06b6d4",color:"#000",fontWeight:700,borderRadius:8,border:"none",cursor:"pointer",fontSize:14}}>Create Ride</button>
              <button onClick={()=>setShowRide(false)} style={{padding:"10px 18px",background:"rgba(255,255,255,0.05)",color:"#9ca3af",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,cursor:"pointer",fontSize:14}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
