<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRYO-GEN Cycling Club</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c18;color:white;font-family:system-ui,sans-serif}
    select option{background:#0f1623}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0f1623}
    ::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;
const { Users, Trophy, Bike, BarChart2, Settings, Plus, Search, X, CheckCircle, Clock, Zap, Activity, TrendingUp, MapPin, Download, Lock, Unlock, ChevronRight, Shield, Calendar, RefreshCw } = LucideReact;

const CAT_COLOR = { "A+":"#FFD700", A:"#EF4444", B:"#3B82F6", C:"#10B981", D:"#8B5CF6" };
const PH_EMOJI  = { climber:"🏔️", sprinter:"⚡", puncheur:"🥊", "all-rounder":"⭐", "time-trialist":"⏱️", pursuiter:"🎯" };
const ZRA_COLOR = { Diamond:"#00D4FF", Ruby:"#EF4444", Emerald:"#10B981", Sapphire:"#3B82F6", Amethyst:"#8B5CF6", Platinum:"#E2E8F0", Gold:"#FBBF24", Silver:"#9CA3AF", Bronze:"#B45309", Copper:"#92400E" };
const TT_STYLE  = { background:"#0b1020", border:"1px solid rgba(255,255,255,0.12)", borderRadius:10, fontSize:12 };
const toFlag    = cc => (cc||"").toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
const fmtDate   = ts => new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const cleanCC   = cc => (cc||"gb").split("-")[0];
const mapPh     = v => (v||"all-rounder").toLowerCase().replace(/\s+/g,"-");
const mapRiders = data => (data.riders||[]).map(r => ({
  id:r.riderId, zwid:r.riderId, name:r.name,
  cc:cleanCC(r.country), cat:r.zpCategory||"D",
  ftp:Math.round(r.zpFTP||0),
  wkg:r.power ? Math.round((r.power.wkg1200||0)*100)/100 : 0,
  velo:r.race?.current?.rating ? Math.round(r.race.current.rating) : 0,
  zraCat:r.race?.current?.mixed?.category||"",
  ph:mapPh(r.phenotype?.value),
  wins:r.race?.wins||0, podiums:r.race?.podiums||0, finishes:r.race?.finishes||0,
  active:!!(r.race?.current?.rating>0), gender:r.gender||"M",
}));

const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

const MEMBERS = [
  {id:1,zwid:25864, name:"Michael Mansfield (CRYO)", cc:"us", cat:"A+", ftp:392, wkg:5.35, velo:3044, zraCat:"Diamond",  ph:"all-rounder", active:true},
  {id:2,zwid:99549, name:"Norman Henderson",         cc:"gb", cat:"A",  ftp:370, wkg:4.73, velo:2409, zraCat:"Diamond",  ph:"all-rounder", active:true},
  {id:3,zwid:180042,name:"Michael Nydegger",         cc:"ch", cat:"A",  ftp:297, wkg:0,    velo:2571, zraCat:"Diamond",  ph:"pursuiter",   active:true},
  {id:4,zwid:15744, name:"Owen Graham",              cc:"gb", cat:"B",  ftp:287, wkg:4.12, velo:1901, zraCat:"Ruby",     ph:"time-trialist",active:true},
  {id:5,zwid:24650, name:"Rick (CRYO-GEN)",          cc:"ie", cat:"B",  ftp:282, wkg:4.07, velo:1325, zraCat:"Amethyst", ph:"all-rounder", active:true},
];
const VELO_TREND = [
  {w:"W14",v:1268},{w:"W15",v:1282},{w:"W16",v:1275},{w:"W17",v:1301},
  {w:"W18",v:1318},{w:"W19",v:1312},{w:"W20",v:1334},{w:"W21",v:1347},
];
const RESULTS = [
  {event:"WTRL TTT S9 W12",date:"14 May",pos:3,total:18,cat:"B",time:"28:14",wkg:3.68},
  {event:"ZRL Division 4",  date:"12 May",pos:1,total:24,cat:"C",time:"42:08",wkg:3.11},
  {event:"Herd Spring R5",  date:"10 May",pos:7,total:45,cat:"A",time:"18:52",wkg:4.31},
  {event:"CRYO Internal",   date:"7 May", pos:1,total:32,cat:"B",time:"35:20",wkg:3.84},
  {event:"ZRL Division 4",  date:"5 May", pos:2,total:22,cat:"C",time:"41:55",wkg:3.15},
];
const TTT_EVENT = {
  title:"CRYO-GEN Weekly TTT", date:"Wed 28 May 2026", time:"19:00 UTC",
  route:"Tempus Fugit", dist:"17.3 km", maxRiders:40,
  format:"4-rider teams · best 3 times count",
  desc:"Sign up by Tue 18:00 UTC. Min 4 riders per team.",
};
const INIT_RIDES = [
  {id:1,title:"Easy Endurance Spin",     date:"2026-05-26",time:"07:00 UTC",route:"Watopia Hilly",      dist:"45 km",pace:"2.0–2.5 w/kg",max:25,desc:"Relaxed social spin. No one gets dropped.",cat:"All"},
  {id:2,title:"B/C Group Ride",          date:"2026-05-27",time:"18:30 UTC",route:"Richmond UCI Circuit",dist:"32 km",pace:"2.5–3.2 w/kg",max:20,desc:"Steady group ride for B and C riders.",    cat:"B/C"},
  {id:3,title:"Thursday Night Chaingang",date:"2026-05-29",time:"19:00 UTC",route:"Crit City – Bell Lap",dist:"25 km",pace:"3.5+ w/kg",  max:15,desc:"Fast chaingang. A/B only. No flicking.",   cat:"A/B"},
  {id:4,title:"Weekend Long Ride",       date:"2026-05-31",time:"09:00 UTC",route:"Epic KOM Reverse",   dist:"85 km",pace:"2.0–3.0 w/kg",max:30,desc:"Big base miles. Coffee stop at the top!",  cat:"All"},
];

function CatBadge({cat}) {
  const c = CAT_COLOR[cat]||"#888";
  return <span style={{background:c+"22",color:c,border:`1px solid ${c}44`,padding:"1px 7px",borderRadius:4,fontSize:11,fontWeight:700}}>{cat}</span>;
}
function StatCard({icon:Icon,label,value,sub,color}) {
  const col = color||"#00D4FF";
  return (
    <div style={{background:"#0f1623",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <Icon size={13} color={col}/>
        <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:col,opacity:0.7}}>{label}</span>
      </div>
      <div style={{fontSize:22,fontWeight:900,color:"white"}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:"#6b7280",marginTop:3}}>{sub}</div>}
    </div>
  );
}

function App() {
  const [tab,setTab]           = useState("dashboard");
  const [sideOpen,setSideOpen] = useState(true);
  const [showAdmin,setAdmin]   = useState(false);
  const [showRide,setShowRide] = useState(false);
  const [signups,setSignupsRaw]= useState([]);
  const [tttLocked,setLocked]  = useState(false);
  const [supName,setSupName]   = useState("");
  const [supCat,setSupCat]     = useState("B");
  const [rides,setRidesRaw]    = useState(INIT_RIDES);
  const [rsvps,setRsvpsRaw]    = useState({});
  const [rsvpId,setRsvpId]     = useState(null);
  const [rsvpName,setRsvpName] = useState("");
  const [newRide,setNewRide]   = useState({title:"",date:"",time:"",route:"",dist:"",pace:"",max:"20",desc:"",cat:"All"});
  const [mSearch,setMSearch]   = useState("");
  const [mCat,setMCat]         = useState("All");
  const [mActive,setMActive]   = useState(false);
  const [mPage,setMPage]       = useState(1);
  const [liveRiders,setLive]   = useState([]);
  const [liveStatus,setLS]     = useState("idle");
  const [liveMsg,setLM]        = useState("Not yet loaded");
  const PER = 10;

  useEffect(() => {
    const s=load("cg_s"); if(s) setSignupsRaw(s);
    const r=load("cg_r"); if(r) setRsvpsRaw(r);
    const ri=load("cg_ri"); if(ri) setRidesRaw(ri);
    fetchLive();
  }, []);

  const setSignups = v => { setSignupsRaw(v); save("cg_s",v); };
  const setRsvps   = v => { setRsvpsRaw(v);  save("cg_r",v); };
  const setRides   = v => { setRidesRaw(v);  save("cg_ri",v); };

  const fetchLive = async () => {
    setLS("loading"); setLM("Connecting to ZwiftRacing.app…");
    try {
      const r = await fetch("/api/proxy?endpoint=team");
      if (r.ok) {
        const d = await r.json();
        if (d.riders && Array.isArray(d.riders)) {
          const mapped = mapRiders(d);
          setLive(mapped); setLS("ok");
          setLM(`Live · ${mapped.length} CRYO-GEN riders ✓`);
        } else { setLS("error"); setLM("Unexpected data format"); }
      } else { setLS("error"); setLM(`API error ${r.status}`); }
    } catch(e) { setLS("error"); setLM(`Error: ${e.message}`); }
  };

  const members = liveRiders.length > 0 ? liveRiders : MEMBERS;
  const active  = members.filter(m => m.active);
  const avgVelo = active.length ? Math.round(active.reduce((s,m)=>s+m.velo,0)/active.length) : 0;
  const catDist = useMemo(()=>{
    const c={};
    active.forEach(m=>{ c[m.cat]=(c[m.cat]||0)+1; });
    return ["A+","A","B","C","D"].filter(k=>c[k]).map(cat=>({cat,count:c[cat]}));
  },[active]);
  const filteredM = useMemo(()=>members.filter(m=>
    m.name.toLowerCase().includes(mSearch.toLowerCase())&&
    (mCat==="All"||m.cat===mCat)&&(!mActive||m.active)
  ),[members,mSearch,mCat,mActive]);
  const pagedM  = filteredM.slice((mPage-1)*PER, mPage*PER);
  const totalPg = Math.ceil(filteredM.length/PER);

  const doSignup = () => {
    if (!supName.trim()) return;
    if (tttLocked) { alert("Sign-ups are locked."); return; }
    if (signups.find(s=>s.name.toLowerCase()===supName.toLowerCase())) { alert("Already signed up!"); return; }
    if (signups.length>=TTT_EVENT.maxRiders) { alert("Event is full."); return; }
    setSignups([...signups,{name:supName.trim(),cat:supCat,ts:new Date().toISOString()}]);
    setSupName("");
  };
  const rmSignup    = ts => setSignups(signups.filter(s=>s.ts!==ts));
  const confirmRsvp = id => {
    if (!rsvpName.trim()) return;
    const cur=rsvps[id]||[];
    if (cur.find(r=>r.name.toLowerCase()===rsvpName.toLowerCase())) { alert("Already RSVP'd!"); return; }
    setRsvps({...rsvps,[id]:[...cur,{name:rsvpName.trim(),ts:new Date().toISOString()}]});
    setRsvpId(null); setRsvpName("");
  };
  const cancelRsvp = (id,name) => setRsvps({...rsvps,[id]:(rsvps[id]||[]).filter(r=>r.name!==name)});
  const createRide = () => {
    if (!newRide.title||!newRide.date) { alert("Title and date required."); return; }
    setRides([...rides,{...newRide,id:Date.now(),max:parseInt(newRide.max)||20}]);
    setShowRide(false);
    setNewRide({title:"",date:"",time:"",route:"",dist:"",pace:"",max:"20",desc:"",cat:"All"});
  };
  const exportCsv = () => {
    const rows=[["Name","Category","Signed Up"],...signups.map(s=>[s.name,s.cat,new Date(s.ts).toLocaleString()])];
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
    a.download="cryogen_ttt.csv"; a.click();
  };

  const NAV=[
    {id:"dashboard",label:"Dashboard",   icon:BarChart2},
    {id:"racing",   label:"Racing",      icon:Trophy},
    {id:"ttt",      label:"TTT Sign-Up", icon:Clock},
    {id:"rides",    label:"Social Rides",icon:Bike},
    {id:"members",  label:"Members",     icon:Users},
  ];
  const scol={idle:"#6b7280",loading:"#FBBF24",ok:"#10B981",error:"#EF4444"}[liveStatus];
  const S={
    card:{background:"#0f1623",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12},
    inp:{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"9px 12px",color:"white",fontSize:13,outline:"none"},
    td:{padding:"11px 18px",borderBottom:"1px solid rgba(255,255,255,0.04)"},
    th:{padding:"9px 18px",textAlign:"left",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"#6b7280",borderBottom:"1px solid rgba(255,255,255,0.07)"},
    lbl:{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"#6b7280",display:"block",marginBottom:5},
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",background:"#080c18",fontFamily:"system-ui,sans-serif",color:"white"}}>
      {/* SIDEBAR */}
      <aside style={{display:"flex",flexDirection:"column",flexShrink:0,width:sideOpen?"220px":"52px",background:"#070b17",borderRight:"1px solid rgba(255,255,255,0.07)",transition:"width 0.2s"}}>
        <div style={{padding:14,borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,#00D4FF,#0066CC)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:"#000",flexShrink:0}}>CG</div>
          {sideOpen&&<div><div style={{fontSize:13,fontWeight:900}}>CRYO-GEN</div><div style={{fontSize:10,color:"#4b5563"}}>Cycling Club</div></div>}
        </div>
        <nav style={{flex:1,padding:8}}>
          {NAV.map(({id,label,icon:Icon})=>(
            <button key={id} onClick={()=>setTab(id)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:8,border:tab===id?"1px solid rgba(0,212,255,0.2)":"1px solid transparent",background:tab===id?"rgba(0,212,255,0.08)":"transparent",color:tab===id?"#00D4FF":"#6b7280",cursor:"pointer",marginBottom:2,textAlign:"left"}}>
              <Icon size={15} style={{flexShrink:0}}/>
              {sideOpen&&<span style={{fontSize:12,fontWeight:600}}>{label}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:8,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
          <button onClick={()=>setAdmin(true)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:8,border:"1px solid transparent",background:"transparent",color:"#4b5563",cursor:"pointer",marginBottom:2}}>
            <Settings size={15} style={{flexShrink:0}}/>{sideOpen&&<span style={{fontSize:12,fontWeight:600}}>Admin</span>}
          </button>
          <button onClick={()=>setSideOpen(o=>!o)} style={{width:"100%",display:"flex",justifyContent:"center",padding:6,border:"none",background:"transparent",color:"#374151",cursor:"pointer"}}>
            <ChevronRight size={13} style={{transform:sideOpen?"rotate(180deg)":"none",transition:"transform 0.2s"}}/>
          </button>
        </div>
      </aside>

      {/* MAIN */}
      <main style={{flex:1,overflow:"auto"}}>
        <div style={{maxWidth:960,margin:"0 auto",padding:32}}>

          {/* ── DASHBOARD ── */}
          {tab==="dashboard"&&(
            <div style={{display:"flex",flexDirection:"column",gap:24}}>
              <div>
                <h2 style={{fontSize:20,fontWeight:900,margin:0}}>Team Overview</h2>
                <p style={{fontSize:13,color:"#6b7280",margin:"4px 0 0"}}>ZwiftPower · ZwiftRacing.app{liveRiders.length>0?" · live data ✓":""}</p>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
                <StatCard icon={Users}      label="Active Riders"  value={active.length} sub={liveRiders.length>0?`${liveRiders.length} in API roster`:"mock data"} color="#00D4FF"/>
                <StatCard icon={Clock}      label="TTT Signups"    value={`${signups.length}/${TTT_EVENT.maxRiders}`} sub="Wed 28 May · 19:00 UTC" color="#10B981"/>
                <StatCard icon={Bike}       label="Upcoming Rides" value={rides.length}  sub="Next ride coming up"   color="#8B5CF6"/>
                <StatCard icon={TrendingUp} label="Avg Team vELO"  value={avgVelo||"—"}  sub={liveRiders.length>0?"Live from ZwiftRacing.app":"mock data"} color="#F59E0B"/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16}}>
                <div style={{...S.card,padding:20}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280",marginBottom:16}}>Team Avg vELO — Last 8 Weeks</div>
                  <ResponsiveContainer width="100%" height={150}>
                    <LineChart data={VELO_TREND} margin={{top:5,right:10,left:0,bottom:5}}>
                      <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)"/>
                      <XAxis dataKey="w" axisLine={false} tickLine={false} tick={{fontSize:10,fill:"#6b7280"}}/>
                      <YAxis domain={[1200,1400]} axisLine={false} tickLine={false} tick={{fontSize:10,fill:"#6b7280"}}/>
                      <Tooltip contentStyle={TT_STYLE} labelStyle={{color:"#fff"}} itemStyle={{color:"#00D4FF"}}/>
                      <Line type="monotone" dataKey="v" name="vELO" stroke="#00D4FF" strokeWidth={2.5} dot={{fill:"#00D4FF",r:3,strokeWidth:0}}/>
                    </LineChart>
                  </ResponsiveContainer>
                </div>
                <div style={{...S.card,padding:20}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280",marginBottom:12}}>Top 5 by vELO</div>
                  {[...active].sort((a,b)=>b.velo-a.velo).slice(0,5).map((m,i)=>(
                    <div key={m.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:9}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:11,color:"#4b5563",width:14}}>{i+1}</span>
                        <span style={{fontSize:13}}>{m.name.split(" ")[0]}</span>
                        <CatBadge cat={m.cat}/>
                      </div>
                      <span style={{fontSize:12,fontFamily:"monospace",color:"#00D4FF",fontWeight:700}}>{m.velo}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={S.card}>
                <div style={{padding:"12px 18px",borderBottom:"1px solid rgba(255,255,255,0.07)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280"}}>Recent Team Results</div>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr>{["Event","Date","Cat","Result","Time","W/kg"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
                  <tbody>{RESULTS.map((r,i)=>(
                    <tr key={i}>
                      <td style={S.td}><span style={{fontWeight:600}}>{r.event}</span></td>
                      <td style={{...S.td,color:"#6b7280",fontSize:12}}>{r.date}</td>
                      <td style={S.td}><CatBadge cat={r.cat}/></td>
                      <td style={{...S.td,color:r.pos<=3?"#FBBF24":"#6b7280",fontWeight:700}}>{r.pos<=3?"🏆 ":""}{r.pos}/{r.total}</td>
                      <td style={{...S.td,fontFamily:"monospace",color:"#9ca3af"}}>{r.time}</td>
                      <td style={{...S.td,fontFamily:"monospace",color:"#00D4FF",fontWeight:700}}>{r.wkg}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── RACING ── */}
          {tab==="racing"&&(
            <div style={{display:"flex",flexDirection:"column",gap:24}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div><h2 style={{fontSize:20,fontWeight:900,margin:0}}>Racing Dashboard</h2><p style={{fontSize:13,color:"#6b7280",margin:"4px 0 0"}}>ZwiftPower · ZwiftRacing.app</p></div>
                <button onClick={fetchLive} disabled={liveStatus==="loading"} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:"#9ca3af",fontSize:12,cursor:"pointer"}}>
                  <RefreshCw size={12}/> Refresh
                </button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div style={{...S.card,padding:16,display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:"#FBBF24",flexShrink:0}}/>
                  <div><div style={{fontSize:13,fontWeight:700}}>ZwiftPower <span style={{color:"#6b7280",fontWeight:400,fontSize:11}}>· Team 2740</span></div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>Engineering API access in progress · mock data shown</div></div>
                </div>
                <div style={{...S.card,padding:16,display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:scol,flexShrink:0}}/>
                  <div><div style={{fontSize:13,fontWeight:700}}>ZwiftRacing.app <span style={{color:"#6b7280",fontWeight:400,fontSize:11}}>· {liveStatus}</span></div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{liveMsg}</div></div>
                </div>
              </div>
              <div style={S.card}>
                <div style={{padding:"12px 18px",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#6b7280"}}>Rider Rankings — vELO</span>
                  <span style={{fontSize:10,color:liveRiders.length>0?"#10B981":"#4b5563",background:"rgba(255,255,255,0.04)",padding:"2px 8px",borderRadius:99}}>{liveRiders.length>0?`${liveRiders.length} riders · live ✓`:"Mock · pending live API"}</span>
                </div>
                <div style={{overflowX:"auto"}}>

                  <div style={{display:"flex",flexWrap:"wrap",gap:"6px 20px",marginBottom:16}}>

                      <select value={supCat} onChange={e=>setSupCat(e.target.value)} style={{...S.inp,width:60}}>{["A+","A","B","C","D"].map(c=><option key={c}>{c}</option>)}</select>

                    <div style={{height:3,background:"rgba(255,255,255,0.07)",borderRadius:2,marginBottom:10}}>

                    {att.length>0&&(
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>

                      <button onClick={()=>{setRsvpId(ride.id);setRsvpName("");}} style={{width:"100%",padding:"9px 0",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer",background:left<=0?"rgba(255,255,255,0.04)":"rgba(0,212,255,0.1)",color:left<=0?"#6b7280":"#00D4FF",border:`1px solid ${left<=0?"rgba(255,255,255,0.06)":"rgba(0,212,255,0.2)"}`}}>

                    <button onClick={()=>setMPage(p=>Math.max(1,p-1))} disabled={mPage===1} style={{padding:"5px 12px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"#9ca3af",cursor:"pointer",opacity:mPage===1?0.3:1}}>←</button>

                  </div>
                </div>
              </div>
            </div>
          )}
        </div>

        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:16}}>

              <button onClick={fetchLive} style={{padding:"10px 0",background:"rgba(0,212,255,0.1)",color:"#00D4FF",border:"1px solid rgba(0,212,255,0.2)",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>↻ Refresh Live Data</button>
              <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:14}}>

              <button onClick={createRide} style={{flex:1,padding:"10px 0",background:"#06b6d4",color:"#000",fontWeight:700,borderRadius:8,border:"none",cursor:"pointer",fontSize:14}}>Create Ride</button>
              <button onClick={()=>setShowRide(false)} style={{padding:"10px 18px",background:"rgba(255,255,255,0.05)",color:"#9ca3af",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,cursor:"pointer",fontSize:14}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
