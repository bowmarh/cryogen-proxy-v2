<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CRYO-GEN race day</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0b1220;color:#e5e7eb;margin:0}main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0 2px}.sub{color:#9ca3af;font-size:14px;margin-bottom:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px 16px;margin-bottom:12px}table{width:100%;border-collapse:collapse}th{text-align:left;color:#9ca3af;font-size:13px;font-weight:600;padding:4px 0}td{padding:6px 0;border-top:1px solid #1f2937}.pos{font-weight:800;color:#67e8f9}.feed div{padding:6px 0;border-top:1px solid #1f2937;font-size:15px}.wait{color:#9ca3af}</style></head>
<body><main><h1>🏁 Race day</h1><div class="sub" id="sub">Loading…</div>
<div class="card"><table><thead><tr><th>Team</th><th>Result</th></tr></thead><tbody id="teams"></tbody></table></div>
<div class="card feed"><b>📻 Radio</b><div id="feed"></div></div></main>
<script>
const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
async function load() {
  try {
    const r = await fetch('/api/public/race'); if (!r.ok) throw new Error('This page is not switched on.'); const d = await r.json();
    document.getElementById('sub').textContent = d.round ? `${d.round} · race ${d.week + 1} · ${d.date} · updates every 30 seconds` : 'No ZRL round is running right now.';
    document.getElementById('teams').innerHTML = (d.teams || []).map(t => `<tr><td>${e(t.name)}</td><td>${t.result ? `<span class="pos">${t.result.pos ? ord(t.result.pos) : 'in'}</span>${t.result.pts !== null && t.result.pts !== undefined ? ` · ${e(t.result.pts)} pts` : ''}` : '<span class="wait">waiting</span>'}</td></tr>`).join('') || '<tr><td colspan="2" class="wait">No teams yet.</td></tr>';
    document.getElementById('feed').innerHTML = (d.feed || []).map(f => `<div>${e(f.text)}</div>`).join('') || '<div class="wait">Nothing yet.</div>';
  } catch (x) { document.getElementById('sub').textContent = x.message; }
}
load(); setInterval(load, 30000);
</script></body></html>
